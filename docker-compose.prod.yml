services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arvexo-connect-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_BASE_URL: "https://api.arvexo.ru"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arvexo-connect-core
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8012:8000"
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: arvexo-connect-bot
    restart: unless-stopped
    env_file:
      - ./bot/.env
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: arvexo-connect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: arvexo_connect
      POSTGRES_USER: arvexo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arvexo_password}
    ports:
      - "127.0.0.1:6432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arvexo -d arvexo_connect"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
