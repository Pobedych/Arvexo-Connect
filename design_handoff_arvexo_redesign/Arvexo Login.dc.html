<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Cormorant:ital,wght@1,500;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#EEEBE3}
  ::selection{background:#14130F;color:#EEEBE3}
  a{text-decoration:none}
  input{font-family:'Onest',sans-serif;outline:none}
  input::placeholder{color:#A39E93}
</style>
</helmet>
<div style="background:#EEEBE3;color:#14130F;font-family:'Onest',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column">

  <!-- NAV -->
  <header style="border-bottom:1px solid rgba(20,19,15,.08)">
    <div style="max-width:1180px;margin:0 auto;padding:18px 36px;display:flex;align-items:center;justify-content:space-between">
      <a href="Arvexo Connect v2.dc.html" style="font-family:'Onest',sans-serif;font-weight:700;font-size:19px;letter-spacing:-.02em;color:#14130F;display:flex;align-items:center;gap:9px">
        <span style="width:9px;height:9px;border-radius:50%;background:{{ accent }};display:inline-block"></span>Arvexo Connect
      </a>
      <a href="Arvexo Connect v2.dc.html" style="display:inline-flex;align-items:center;gap:7px;color:#57534B;font-size:14px;font-weight:500" style-hover="color:#14130F">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M11 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        На сайт
      </a>
    </div>
  </header>

  <!-- BODY -->
  <main style="flex:1;display:grid;grid-template-columns:1fr 1fr;max-width:1180px;margin:0 auto;width:100%;padding:0 36px;align-items:center;gap:80px">

    <!-- left value -->
    <div style="padding:60px 0">
      <div style="font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.16em;color:#8A857B;margin-bottom:28px">ARVEXO ACCOUNT</div>
      <h1 style="font-family:'Onest',sans-serif;font-weight:700;font-size:56px;line-height:.98;letter-spacing:-.04em;margin-bottom:24px">Доступ к вашему <span style="font-family:'Cormorant',serif;font-style:italic;font-weight:600;color:{{ accent }}">интернету</span></h1>
      <p style="font-size:18px;line-height:1.55;color:#4A463F;max-width:420px;margin-bottom:40px">Один аккаунт — все подписки, устройства и режимы. Профиль обновляется по той же ссылке, без переустановки.</p>
      <div style="display:flex;flex-direction:column;gap:18px">
        <sc-for list="{{ points }}" as="p" hint-placeholder-count="3">
          <div style="display:flex;align-items:center;gap:13px">
            <span style="width:30px;height:30px;border-radius:9px;background:#FBFAF7;border:1px solid rgba(20,19,15,.1);display:flex;align-items:center;justify-content:center;flex:none">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5 9-11" stroke="{{ accent }}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span style="font-size:15.5px;color:#3B382F;font-weight:500">{{ p }}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- form card -->
    <div style="display:flex;justify-content:flex-end">
      <div style="width:100%;max-width:440px;background:#FBFAF7;border:1px solid rgba(20,19,15,.1);border-radius:22px;padding:34px;box-shadow:0 30px 70px -34px rgba(20,19,15,.3)">
        <h2 style="font-family:'Onest',sans-serif;font-weight:700;font-size:28px;letter-spacing:-.025em;margin-bottom:22px">{{ title }}</h2>

        <!-- tabs -->
        <div style="display:flex;gap:4px;background:#EEEBE3;border:1px solid rgba(20,19,15,.08);border-radius:100px;padding:4px;margin-bottom:26px">
          <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
            <button onClick="{{ t.onClick }}" style="flex:1;border:none;cursor:pointer;font-family:'Onest',sans-serif;font-weight:600;font-size:13.5px;padding:10px 8px;border-radius:100px;{{ t.style }}">{{ t.label }}</button>
          </sc-for>
        </div>

        <!-- fields -->
        <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:22px">
          <sc-for list="{{ fields }}" as="f" hint-placeholder-count="3">
            <input type="{{ f.type }}" placeholder="{{ f.placeholder }}" style="width:100%;background:#fff;border:1px solid rgba(20,19,15,.14);border-radius:12px;padding:15px 16px;font-size:15px;color:#14130F" style-focus="border-color:{{ accent }}" />
          </sc-for>
        </div>

        <button onClick="{{ noop }}" style="width:100%;border:none;cursor:pointer;background:{{ accent }};color:#fff;font-family:'Onest',sans-serif;font-weight:600;font-size:15.5px;padding:16px;border-radius:100px;margin-bottom:18px" style-hover="filter:brightness(1.06)">{{ cta }}</button>

        <p style="font-size:13px;line-height:1.5;color:#8A857B;text-align:center">{{ hint }}</p>
      </div>
    </div>
  </main>

  <footer style="border-top:1px solid rgba(20,19,15,.08)">
    <div style="max-width:1180px;margin:0 auto;padding:24px 36px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#A39E93">© 2026 Arvexo</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#A39E93">connect.arvexo.ru</span>
    </div>
  </footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:760},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;#E5402C&quot;,&quot;#1A1A1A&quot;,&quot;#3D5AFE&quot;,&quot;#1FB46A&quot;,&quot;#C9A227&quot;],&quot;default&quot;:&quot;#E5402C&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { tab: 'reg' };
  renderVals() {
    const accent = this.props.accent ?? '#E5402C';
    const tab = this.state.tab;
    const defs = [
      { id: 'reg', label: 'Регистрация' },
      { id: 'login', label: 'Вход' },
      { id: 'key', label: 'Access key' },
    ];
    const tabs = defs.map(d => ({
      label: d.label,
      onClick: () => this.setState({ tab: d.id }),
      style: tab === d.id
        ? 'background:#14130F;color:#EEEBE3'
        : 'background:transparent;color:#57534B',
    }));
    const config = {
      reg: {
        title: 'Создать аккаунт',
        fields: [
          { type: 'text', placeholder: 'Имя' },
          { type: 'email', placeholder: 'email@example.com' },
          { type: 'password', placeholder: 'Пароль' },
        ],
        cta: 'Создать Arvexo Account',
        hint: 'Регистрируясь, вы принимаете условия использования и политику конфиденциальности.',
      },
      login: {
        title: 'С возвращением',
        fields: [
          { type: 'email', placeholder: 'email@example.com' },
          { type: 'password', placeholder: 'Пароль' },
        ],
        cta: 'Войти',
        hint: 'Забыли пароль? Восстановите доступ через Telegram-бота.',
      },
      key: {
        title: 'Вход по ключу',
        fields: [
          { type: 'text', placeholder: 'ARVX-0000-0000-0000' },
        ],
        cta: 'Войти по ключу',
        hint: 'Ключ доступа выдаётся в Telegram-боте при покупке подписки.',
      },
    };
    const c = config[tab];
    return {
      accent, tabs,
      title: c.title, fields: c.fields, cta: c.cta, hint: c.hint,
      noop: () => {},
      points: [
        'Smart Russia, Privacy и Global в одном профиле',
        'Один ключ — телефон, ПК, планшет и роутер',
        'Поддержка и выдача доступа в Telegram',
      ],
    };
  }
}
</script>
</body>
</html>
