services:
  frontend:
    image: node:22-alpine
    container_name: arvexo-connect-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: "http://127.0.0.1:8012"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started

  backend:
    image: python:3.12-slim
    container_name: arvexo-connect-core-dev
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - ./backend/.env.dev
    ports:
      - "127.0.0.1:8012:8000"
    volumes:
      - ./backend:/app
      - backend_pip_cache:/root/.cache/pip
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    image: python:3.12-slim
    container_name: arvexo-connect-bot-dev
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && python -m app.main"
    env_file:
      - ./bot/.env.dev
    volumes:
      - ./bot:/app
      - bot_pip_cache:/root/.cache/pip
    depends_on:
      backend:
        condition: service_started
    profiles:
      - bot

  postgres:
    image: postgres:16-alpine
    container_name: arvexo-connect-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: arvexo_connect
      POSTGRES_USER: arvexo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arvexo_password}
    ports:
      - "127.0.0.1:6432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arvexo -d arvexo_connect"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data_dev:
  frontend_node_modules:
  backend_pip_cache:
  bot_pip_cache:
