name: Checks

# Переиспользуемый workflow: вызывается из ci.yml (на каждый push/PR) и из
# deploy.yml (как условие перед деплоем на master/main). Не запускается сам по себе.
on:
  workflow_call:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Static checks (undefined names, broken imports, syntax errors)
        working-directory: backend
        run: |
          pip install ruff==0.8.4
          ruff check --select F,E9 app scripts tests

      - name: Run tests
        working-directory: backend
        run: pytest -q

  migrations:
    name: Migration smoke test (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: arvexo_connect
          POSTGRES_USER: arvexo
          POSTGRES_PASSWORD: arvexo_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arvexo -d arvexo_connect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply all migrations to a clean database
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://arvexo:arvexo_password@localhost:5432/arvexo_connect
        run: alembic upgrade head

      - name: Check models match migration history
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://arvexo:arvexo_password@localhost:5432/arvexo_connect
        run: alembic check

  bot:
    name: Bot import check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies
        working-directory: bot
        run: pip install -r requirements.txt

      - name: Validate imports
        working-directory: bot
        run: python -m compileall app

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
